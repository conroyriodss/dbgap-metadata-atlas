name: Code and publication safeguards
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    # Avoid the rolling ubuntu-latest OS migration. The hosted image still receives updates.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, node24; verified 2026-10-22
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, node24; verified 2026-10-22
        with:
          python-version: '3.13'
      - name: Record actual runtime
        run: |
          python --version
          cat /etc/os-release
      - name: Static notebook and publication checks
        run: python scripts/check_repo.py
      - name: Repository-tool unit tests (no scientific API calls)
        run: python -m unittest discover -s tests -v
